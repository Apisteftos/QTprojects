# ============================================================
# CI/CD Pipeline for QTprojects
# https://github.com/Apisteftos/QTprojects
#
# Triggers:
#   - Every push to main branch
#   - Every pull request to main branch
#
# What it does:
#   1. Spins up Ubuntu runner (free GitHub-hosted)
#   2. Installs Qt6 + build tools
#   3. Builds qt_cicd_demo (the app)
#   4. Builds qt_cicd_demo_tests (the test suite)
#   5. Runs all tests headless (no display needed)
#   6. Reports pass ✅ or fail ❌
# ============================================================

name: CI
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
env:
  CICD_DIR: 12_BuildTestDeploy/qt_cicd_demo
  TEST_DIR: 12_BuildTestDeploy/qt_test_demo

jobs:
  build-and-test:
    name: Build & Test (Ubuntu + Qt6)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Qt6 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            libqt6sql6-sqlite \
            cmake \
            build-essential

      - name: Build qt_cicd_demo app
        working-directory: ${{ env.CICD_DIR }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Build qt_cicd_demo tests
        working-directory: ${{ env.CICD_DIR }}/tests
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run qt_cicd_demo tests
        working-directory: ${{ env.CICD_DIR }}/tests/build
        run: QT_QPA_PLATFORM=offscreen ./qt_cicd_demo_tests -v2

      - name: Build qt_test_demo
        working-directory: ${{ env.TEST_DIR }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run qt_test_demo tests
        working-directory: ${{ env.TEST_DIR }}/build
        run: QT_QPA_PLATFORM=offscreen ./qt_test_demo -v2
